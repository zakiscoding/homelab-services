# iMac services stack — data lives under ./data/ on the 1TB drive
# Docs: ../homelab/docs/

services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      GPU_URL: ${GPU_URL}
      GPU_VISION_URL: ${GPU_VISION_URL:-http://100.88.71.33:8100}
      REACTION_SERVE_KEY: ${REACTION_SERVE_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      API_KEY: ${API_KEY}
      WORKER_API_KEY: ${WORKER_API_KEY}
      # Traces to the collector below; set OTEL_EXPORTER_OTLP_ENDPOINT= (empty) in .env to turn off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SERVICE_NAME: homelab-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    ports:
      # Tailscale/LAN: GPU worker + ops (do not port-forward to internet)
      - "8000:8000"
    networks:
      - backend

  imac-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      WORKER_API_KEY: ${WORKER_API_KEY}
      WORKER_ID: imac-worker
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      # Phase 4: GPU worker wake (Tailscale/LAN only — do not expose to internet)
      - "6379:6379"
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - backend

  pushgateway:
    image: prom/pushgateway:latest
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - backend

  # --- Tracing, SLOs and alerting (docs/OBSERVABILITY-SLO.md) ---
  # Config files are copied in by scripts/sync-observability.sh (Colima bind-mount quirk, as for
  # Prometheus), so on a fresh host start these, run the script, and they restart with it.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      # Tailnet senders (vLLM on the GPU PC) reach these via `tailscale serve --tcp 4317/4318`.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on: [tempo]
    networks: [backend]

  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./data/tempo:/var/tempo
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    user: "0"  # like prometheus/grafana here: ./data on the external drive is root-owned in the VM
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./data/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [backend]

  # Host networking on purpose: on this Colima VM, outbound connections from containers behind
  # Docker's bridge NAT time out intermittently (about 2 in 3 to tailnet hosts and the public
  # gateway, measured 2026-11-14) while the VM itself connects reliably. Probes must not inherit
  # that, or they'd page about the network path instead of the target. See docs/OBSERVABILITY-SLO.md.
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    network_mode: host
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--web.listen-address=:9115"]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"  # blackbox exporter on the VM's host network
    volumes:
      # Config injected via scripts/sync-prometheus-config.sh (Colima bind-mount quirk)
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - qdrant
      - pushgateway
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env (scripts/bootstrap-env.sh does it)}
      # Provisioning lives under data/grafana/ (see scripts/sync-grafana-provisioning.sh)
      GF_PATHS_PROVISIONING: /var/lib/grafana/provisioning
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        pip install -q psycopg2-binary &&
        exec mlflow server
        --host=0.0.0.0
        --port=5000
        --backend-store-uri=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --default-artifact-root=/mlflow-artifacts
        --serve-artifacts
    volumes:
      - ./data/mlflow:/mlflow-artifacts
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: ../homelab-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOMELAB_API_URL: http://api:8000
      HOMELAB_API_KEY: ${API_KEY}
    ports:
      # Grafana uses host :3000 — web UI on :3081 (3080 may be taken by SSH/Tailscale on iMac)
      - "3081:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    # Default LAN: no Caddyfile bind (Colima virtiofs breaks single-file mounts).
    # Public HTTPS: ./scripts/sync-caddy-config.sh after render-caddyfile.sh
    command: ["caddy", "reverse-proxy", "--from", ":80", "--to", "web:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:
    driver: bridge

