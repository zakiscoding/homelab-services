# iMac services stack — data lives under ./data/ on the 1TB drive
# Docs: ../homelab/docs/

services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      GPU_URL: ${GPU_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      API_KEY: ${API_KEY}
      WORKER_API_KEY: ${WORKER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    networks:
      - backend

  imac-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      WORKER_API_KEY: ${WORKER_API_KEY}
      WORKER_ID: imac-worker
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      # Phase 4: GPU worker wake (Tailscale/LAN only — do not expose to internet)
      - "6379:6379"
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - backend

  pushgateway:
    image: prom/pushgateway:latest
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/config:/etc/prometheus:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - qdrant
      - pushgateway
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Provisioning lives under data/grafana/ (see scripts/sync-grafana-provisioning.sh)
      GF_PATHS_PROVISIONING: /var/lib/grafana/provisioning
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", ":80", "--to", "api:8000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - api
    networks:
      - backend

networks:
  backend:
    driver: bridge
