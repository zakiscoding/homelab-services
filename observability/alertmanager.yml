# Alertmanager: routes Prometheus alerts by severity to one webhook.
#
# The webhook URL is a secret (anyone with it can post to the channel), so it is read from a file
# that scripts/sync-observability.sh writes from ALERT_WEBHOOK_URL in .env. It is never committed.
# Without ALERT_WEBHOOK_URL, alerts are still visible in the Alertmanager UI and Grafana.
global:
  resolve_timeout: 5m

route:
  receiver: webhook
  group_by: [alertname, slo, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - matchers: [severity="page"]
      receiver: webhook
      group_wait: 10s
      repeat_interval: 4h

inhibit_rules:
  # One root cause, one page: when WSL is down, the chat-on-GPU SLO burning is a consequence.
  - source_matchers: [alertname="GpuPcWslDown"]
    target_matchers: [slo=~"chat-on-gpu|gateway-chat-on-gpu"]

receivers:
  - name: webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        max_alerts: 20
