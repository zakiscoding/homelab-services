# OpenTelemetry Collector: the homelab's one trace intake, on the iMac.
#
#   homelab-api (this compose)          --OTLP/HTTP--> otel-collector:4318
#   vLLM in WSL / Ubuntu boot (tailnet) --OTLP/gRPC--> 100.91.113.98:4317 (tailscale serve)
#   vllm-gateway Worker                 --OTLP/HTTP--> VPC service "otel-imac" -> tunnel mos-imac -> otel-collector:4318
#
# Traces go to Tempo. The spanmetrics connector also turns every span into request-count and
# latency-histogram series (scraped by Prometheus on :8889), which is where the gateway's SLIs
# come from: the Worker has no /metrics endpoint of its own.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s
  # Defence in depth: the senders never set these, but drop them if one ever does.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.x-api-key, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 15s, 30s, 60s, 120s]
    dimensions:
      - name: http.route
      - name: http.response.status_code
      - name: gateway.backend
      - name: llm.backend
    exclude_dimensions: [span.name]
    metrics_flush_interval: 15s
    metrics_expiration: 10m

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      # Since v0.123 the default is localhost:8888, which Prometheus in another container can't reach.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
