suite: secrets come from an existing Secret, never from values
templates:
  - templates/api.yaml
  - templates/configmap.yaml
  - templates/worker.yaml
  - templates/postgres.yaml
  - templates/grafana.yaml
  - templates/web.yaml
  - templates/mlflow.yaml
tests:
  - it: renders no Secret object in any template
    asserts:
      - not: true
        isKind:
          of: Secret
  - it: api reads the Postgres password and API keys from homelab-secrets
    template: templates/api.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: { secretKeyRef: { name: homelab-secrets, key: POSTGRES_PASSWORD } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom: { secretKeyRef: { name: homelab-secrets, key: API_KEY } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
  - it: optional keys are marked optional so a minimal Secret is enough
    template: templates/api.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLM_API_KEY
            valueFrom: { secretKeyRef: { name: homelab-secrets, key: LLM_API_KEY, optional: true } }
  - it: a custom existingSecret name reaches postgres
    template: templates/postgres.yaml
    documentSelector: { path: kind, value: StatefulSet }
    set: { secrets.existingSecret: prod-homelab }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: { secretKeyRef: { name: prod-homelab, key: POSTGRES_PASSWORD } }
  - it: a custom existingSecret name reaches grafana
    template: templates/grafana.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { secrets.existingSecret: prod-homelab }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom: { secretKeyRef: { name: prod-homelab, key: GRAFANA_PASSWORD } }
  - it: a custom existingSecret name reaches web
    template: templates/web.yaml
    documentSelector: { path: kind, value: Deployment }
    set: { secrets.existingSecret: prod-homelab }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOMELAB_API_KEY
            valueFrom: { secretKeyRef: { name: prod-homelab, key: API_KEY } }
  - it: an empty existingSecret is rejected
    template: templates/api.yaml
    set: { secrets.existingSecret: "" }
    asserts:
      - failedTemplate: {}
