{{- if .Values.grafana.enabled }}
{{- $c := .Values.grafana }}
{{- $provisioning := (.Files.Glob "files/grafana/datasources/*.yml").AsConfig }}
{{- $providers := (.Files.Glob "files/grafana/dashboard-providers/*.yml").AsConfig }}
{{- $dashboards := (.Files.Glob "files/grafana/dashboards/*.json").AsConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  {{- $provisioning | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  {{- $providers | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  {{- $dashboards | nindent 2 }}
{{- if $c.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  annotations:
    # Same wave as the workload: k3s local-path binds on first consumer, so a claim in an
    # earlier wave would stay Pending and stall the sync.
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "grafana") | nindent 4 }}
    # Keep dashboards/users if the release or Argo CD Application is deleted or pruned.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  {{- $sc := $c.persistence.storageClass | default .Values.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "grafana") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # ReadWriteOnce volume + SQLite: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "grafana") | nindent 8 }}
      annotations:
        checksum/provisioning: {{ print $provisioning $providers | sha256sum }}
        checksum/dashboards: {{ $dashboards | sha256sum }}
    spec:
      {{- include "homelab.podCommon" (dict "ctx" $ "comp" $c) | nindent 6 }}
      containers:
        - name: grafana
          image: {{ include "homelab.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab.secretName" . }}
                  key: GRAFANA_USER
                  optional: true
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab.secretName" . }}
                  key: GRAFANA_PASSWORD
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # files/grafana/dashboard-providers/default.yml points at this path
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: data
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: grafana-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "grafana") | nindent 4 }}
spec:
  selector:
    {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
