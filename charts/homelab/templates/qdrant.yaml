{{- if .Values.qdrant.enabled }}
{{- $c := .Values.qdrant }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "qdrant") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "qdrant") | nindent 4 }}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "qdrant") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "qdrant") | nindent 8 }}
    spec:
      {{- include "homelab.podCommon" (dict "ctx" $ "comp" $c) | nindent 6 }}
      containers:
        - name: qdrant
          image: {{ include "homelab.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      {{- if not $c.persistence.enabled }}
      volumes:
        {{- include "homelab.emptyDirIfNoPersistence" (dict "comp" $c "name" "data") | nindent 8 }}
      {{- end }}
  {{- include "homelab.volumeClaimTemplate" (dict "ctx" $ "comp" $c "name" "data") | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "qdrant") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "qdrant") | nindent 4 }}
spec:
  selector:
    {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "qdrant") | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
{{- end }}
