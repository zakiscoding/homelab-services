{{- if .Values.postgres.enabled }}
{{- $c := .Values.postgres }}
{{- if $c.initScripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  {{- (.Files.Glob "files/postgres/*.sql").AsConfig | nindent 2 }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
      {{- if $c.initScripts }}
      annotations:
        checksum/initdb: {{ ($.Files.Glob "files/postgres/*.sql").AsConfig | sha256sum }}
      {{- end }}
    spec:
      {{- include "homelab.podCommon" (dict "ctx" $ "comp" $c) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "homelab.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            {{- include "homelab.secretEnv" (dict "ctx" $ "name" "POSTGRES_USER") | nindent 12 }}
            {{- include "homelab.secretEnv" (dict "ctx" $ "name" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- include "homelab.secretEnv" (dict "ctx" $ "name" "POSTGRES_DB") | nindent 12 }}
            # Subdirectory: the root of a fresh volume may hold lost+found, which initdb rejects.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Same check as the compose healthcheck (pg_isready -U $POSTGRES_USER -d $POSTGRES_DB)
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            {{- if $c.initScripts }}
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        {{- if $c.initScripts }}
        - name: initdb
          configMap:
            name: postgres-initdb
        {{- end }}
        {{- include "homelab.emptyDirIfNoPersistence" (dict "comp" $c "name" "data") | nindent 8 }}
  {{- include "homelab.volumeClaimTemplate" (dict "ctx" $ "comp" $c "name" "data") | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
