{{- if .Values.prometheus.enabled }}
{{- $c := .Values.prometheus }}
{{- $config := $c.configOverride | default (.Files.Get "files/prometheus/prometheus.yml") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  prometheus.yml: |-
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      {{- include "homelab.podCommon" (dict "ctx" $ "comp" $c) | nindent 6 }}
      containers:
        - name: prometheus
          image: {{ include "homelab.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $c.retention }}
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        {{- include "homelab.emptyDirIfNoPersistence" (dict "comp" $c "name" "data") | nindent 8 }}
  {{- include "homelab.volumeClaimTemplate" (dict "ctx" $ "comp" $c "name" "data") | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
spec:
  selector:
    {{- include "homelab.selectorLabels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
