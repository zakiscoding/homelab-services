{{- if .Values.api.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-config
  labels:
    {{- include "homelab.labels" (dict "ctx" $ "component" "config") | nindent 4 }}
  annotations:
    {{- include "homelab.syncWave" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  REDIS_URL: "redis://redis:6379/0"
  QDRANT_URL: "http://qdrant:6333"
{{- end }}
