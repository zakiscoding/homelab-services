# Symptom alerts that SLO burn rates can't express. Runbooks: docs/OPERATIONS.md#alerts
groups:
  # Since 2026-11-14 the GPU PC runs WSL (vLLM, GopherGrid workers, its Prometheus) only for work
  # sessions and the 03:30 nightly benchmark, so "WSL down" and "vLLM down" are normal and no longer
  # alert. What has to keep working is the nightly run: it starts WSL, benchmarks the GPU through
  # GopherGrid, pushes the result to this Pushgateway, and shuts WSL down again. These two alerts
  # replace GpuPcWslDown and GpuPcLlmOffline. Runbook: gpu-systems-lab regress/README.md.
  - name: gpu-pc
    rules:
      - alert: GpuNightlyRegression
        expr: max by (precision) (gg_nightly_regression{job="gg_nightly", run=""}) == 1
        labels: {severity: ticket}
        annotations:
          summary: "Nightly GPU matmul {{ $labels.precision }} is more than 5% below its 7-run median"
          description: "The GPU PC got slower. Compare gg_nightly_tflops with gg_nightly_baseline_tflops."

      # No push for 2 days covers the PC being off, the Windows task not running, and WSL failing
      # to start; job_ok == 0 covers a run that started but failed.
      - alert: GpuNightlyJobMissing
        expr: |
          time() - max(gg_nightly_last_run_timestamp_seconds{job="gg_nightly", run=""}) > 2 * 86400
          or max(gg_nightly_job_ok{job="gg_nightly", run=""}) == 0
          or absent(gg_nightly_last_run_timestamp_seconds{job="gg_nightly", run=""})
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "The nightly GPU benchmark failed or hasn't reported for 2 days"
          description: >-
            Check the "GPU Nightly Benchmark" task and %LOCALAPPDATA%\gpu-nightly.log on the GPU PC,
            or run scripts/gpu-pc-up.sh --check from the laptop.

  - name: edge-and-pipeline
    rules:
      - alert: GatewayHealthDown
        expr: probe_success{job="blackbox-gateway"} == 0
        for: 10m  # longer than MonitoringEgressDegraded takes to fire, so it can be inhibited
        labels: {severity: page}
        annotations:
          summary: "Public gateway /health is failing"
          description: "The Cloudflare Worker itself is not answering /health from the iMac."

      # The iMac can't reliably reach the internet itself, so its probes say nothing about targets.
      - alert: MonitoringEgressDegraded
        expr: avg_over_time(probe_success{job="blackbox-control"}[5m]) < 0.9
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "The iMac's probes can't reach a control site reliably; probe alerts are suppressed"
          description: >-
            Under 90% of probes to the control URL succeeded over 5 minutes. Gateway health pages are
            inhibited until this clears. Check Colima networking (docs/OBSERVABILITY-SLO.md).

      # Without the collector, the gateway SLOs go quiet instead of firing, so watch it directly.
      - alert: TraceIntakeDown
        expr: up{job="otel-collector"} == 0 or absent(up{job="otel-collector"})
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "OpenTelemetry Collector is down; traces and gateway SLIs are missing"
