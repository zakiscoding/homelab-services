# Symptom alerts that SLO burn rates can't express. Runbooks: docs/OPERATIONS.md#alerts
groups:
  - name: gpu-pc
    rules:
      # The 2026-11-04 outage: Windows was up (its SSH answered over the tailnet) while WSL, and
      # with it vLLM, its Prometheus and the tunnel, had stopped. Nothing alerted for 9 days.
      # Requiring the Windows host to be up separates this from "the PC is off" or "it is in
      # the Ubuntu boot", which are normal.
      - alert: GpuPcWslDown
        expr: |
          max by (node) (probe_success{job="blackbox-gpu-pc", boot="windows"}) == 1
          unless on (node)
          max by (node) (up{job="vllm", boot="windows"}) == 1
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "GPU PC is up in Windows but vLLM in WSL is unreachable"
          description: >-
            Windows answers on the tailnet but vLLM (WSL) has been down for 15 minutes, so chat
            falls back to Ollama / Workers AI. Check `wsl -l -v` and the "WSL Keep Alive"
            scheduled task on the GPU PC.

      # Neither boot is serving vLLM for half a day. Often deliberate (the PC is off), so a ticket.
      - alert: GpuPcLlmOffline
        expr: max(up{job="vllm"}) == 0 or absent(up{job="vllm"})
        for: 12h
        labels: {severity: ticket}
        annotations:
          summary: "No vLLM on either boot of the GPU PC for 12 hours"
          description: "Chat has been on a fallback model for 12 hours. Intended if the PC is off."

  - name: edge-and-pipeline
    rules:
      - alert: GatewayHealthDown
        expr: probe_success{job="blackbox-gateway"} == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Public gateway /health is failing"
          description: "The Cloudflare Worker itself is not answering /health from the iMac."

      # Without the collector, the gateway SLOs go quiet instead of firing, so watch it directly.
      - alert: TraceIntakeDown
        expr: up{job="otel-collector"} == 0 or absent(up{job="otel-collector"})
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "OpenTelemetry Collector is down; traces and gateway SLIs are missing"
