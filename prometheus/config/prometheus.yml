global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: homelab-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # --- Other homelab nodes, over the tailnet (each shared with `tailscale serve`) ---

  # GPU PC: pull its local Prometheus (dcgm-exporter, node-exporter). Only one boot is up
  # at a time, so one of these two targets is always down.
  - job_name: gpu-pc-federate
    honor_labels: true
    metrics_path: /federate
    params:
      "match[]": ['{job=~"dcgm|node"}']
    static_configs:
      - targets: ["100.88.71.33:9090"]
        labels: { node: gpu-pc, boot: windows }
      - targets: ["100.121.51.35:9090"]
        labels: { node: gpu-pc, boot: ubuntu }

  - job_name: vllm
    static_configs:
      - targets: ["100.88.71.33:8000"]
        labels: { node: gpu-pc, boot: windows }
      - targets: ["100.121.51.35:8000"]
        labels: { node: gpu-pc, boot: ubuntu }

  # GopherGrid (github.com/zakiscoding/gophergrid, deploy/homelab)
  - job_name: gophergrid-scheduler
    static_configs:
      - targets: ["100.91.113.98:8090"]
        labels: { node: mos-imac, instance_name: scheduler-1 }
      - targets: ["100.73.132.95:8091"]
        labels: { node: hp-laptop, instance_name: scheduler-2 }

  - job_name: gophergrid-worker
    static_configs:
      - targets: ["100.73.132.95:9101"]
        labels: { node: hp-laptop, worker: hp-laptop }
      - targets: ["100.88.71.33:9102"]
        labels: { node: gpu-pc, worker: gpu-pc }

  # --- Tracing and SLOs (observability/, docs/OBSERVABILITY-SLO.md) ---

  # Span metrics from the OpenTelemetry Collector: the gateway's request and latency SLIs.
  # honor_labels keeps job/service_name from the spans instead of "otel-collector".
  - job_name: otel-collector-spanmetrics
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: blackbox-gateway
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://vllm-gateway.vllm-gateway.workers.dev/health"]
    relabel_configs: &blackbox
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "host.docker.internal:9115" }

  # Control probe: a well-known site. When this fails too, the problem is the iMac's own egress,
  # not the target, and Alertmanager suppresses the target alerts (see MonitoringEgressDegraded).
  - job_name: blackbox-control
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://www.cloudflare.com/cdn-cgi/trace"]
    relabel_configs: *blackbox

  # Synthetic "is chat on the GPU?": /health/gpu reports which LLM backend answers.
  - job_name: blackbox-llm
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /probe
    params: { module: [http_llm_on_vllm] }
    static_configs:
      - targets: ["http://127.0.0.1:8000/health/gpu"]  # api's published port, from the host network
    relabel_configs: *blackbox

  # Is each boot of the GPU PC up at all? (SSH on the tailnet.) Pairs with job="vllm" above.
  - job_name: blackbox-gpu-pc
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      # Windows: `tailscale serve --bg --tcp 2222 tcp://127.0.0.1:22` on the GPU PC (see blackbox.yml)
      - targets: ["100.88.71.33:2222"]
        labels: { node: gpu-pc, boot: windows }
      - targets: ["100.121.51.35:22"]
        labels: { node: gpu-pc, boot: ubuntu }
    relabel_configs: *blackbox
