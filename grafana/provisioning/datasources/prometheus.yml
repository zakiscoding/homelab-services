apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  # GPU PC's Ubuntu boot (zak-gpu-node): DCGM GPU metrics + node-exporter,
  # gpu-systems-lab/observability. Over Tailscale; down while the PC runs Windows.
  - name: GPU node (zak-gpu-node)
    uid: gpu-node-prom
    type: prometheus
    access: proxy
    url: http://100.121.51.35:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 5s
  # Traces from the OpenTelemetry Collector (observability/). Click a trace ID in Explore.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
